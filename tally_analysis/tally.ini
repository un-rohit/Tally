;;TallyPrime workstation specific parameters file
[TALLY]

;;** Gateway server configuration, 
;; ** Tally Gateway Server=server:port
Tally Gateway Server=localhost:9999

;;Specify list of TDL files for user defined reports and changes, 
;; ** TO STOP LOADING TDL FILES, set the following line to NO
User TDL=Yes

LicTimeout=

;;Specify list of companies to preload, 
;; ** TO STOP DEFAULT LOADING set the following line to NO
Default Companies=Yes
Load=100000

;;Specify the list of gold gateway servers to subscribe
Tally Gold License Server=

;;Specify location of Data files
Data=C:\Users\Public\TallyPrime\data

;;Specify whether Dashboard should be shown on loading of a company, 
;; ** TO STOP LOADING DASHBOARD ON COMPANY LOAD set the following line to No
ShowDashboardOnCompanyLoad=No

Client Server=None
ServerPort=9000
Enable ODBC Server=Yes
Load Buffering=Yes
Ignore Tcp Timeout=Yes

;;Specify whether optimized batch procesing for bulk operations for companies 
;;** TO DISABLE optimized batch processing set the following line to No
EnableOptimizedBatchProcessing=Yes

;;Specify whether optimise loading of reports 
;;** TO DISABLE optimise loading of reports set the following line to No
EnableOptimizedReportsLoading=Yes

;;Specify whether optimise loading of companies 
;;** TO DISABLE optimise loading of companies, set the following line to No
EnableOptimizedCmpLoading=Yes

;;Specify Migration Configurations 
;;Specify Port number of TallyPrime or TallyPrime Edit Log for Migration
MigrationTallyPrimePort=9009
;;Specify Port number of Migration Tool
MigrationToolPort=9509
;;Specify Batch Size for Migration Tool
MigrationBatchSize=200

;;Specify the maximum size (in MB) for the incremental backup file (IncrState.1800)
;;Once this size is reached, the file will be recreated automatically
;;For example, to set this to 500 MB write IncrementalBackupBufferLimit=500
;;or for 1 GB write IncrementalBackupBufferLimit=1024
IncrementalBackupBufferLimit=1024

;;Specify location of TALLYSAV.tsf (saved configuration of Tally)
Config=C:\Program Files\TallyPrime

;;Specify location of Language Files
LangPath=C:\Program Files\TallyPrime\lang

;;Specify location where files are created during export by default
Export Path=C:\Program Files\TallyPrime

;;Specify Color details of local monitor
Color=Yes
ComfortView=Bright
ShowBtmToolbar=Yes
Sound=Yes

Width=1920
Height=1020
